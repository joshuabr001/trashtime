services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trashtime
      POSTGRES_USER: trashtime
      POSTGRES_PASSWORD: trashtime_local_only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - trashtime_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trashtime -d trashtime']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trashtime_pgdata:
